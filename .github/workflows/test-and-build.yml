name: Java CI
permissions:
  contents: read
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '8', '17', '21', '25' ]
    name: Java ${{ matrix.Java }} build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          cache: 'maven'
          cache-dependency-path: 'pom.xml'
      - name: Build with Maven
        # -Dmaven.compiler.release=8 强制 javac 按 Java 8 ct.sym 校验标准库调用，
        # 编译期就拦下 List.of / String.isBlank / Stream.toList 等 Java 9+ API 残留。
        # JDK 25 的 javac 不再支持 "1.8" 这种旧版本号格式，只能传 "8"，故用命令行注入。
        run: mvn package -P !develop -Dmaven.compiler.release=8
