# slf4j-simple 配置文件 —— 替代原 test/resources/logback.xml
# 运行时调级别（覆盖本文件默认值）：
#   -Dorg.slf4j.simpleLogger.defaultLogLevel=DEBUG                 全局
#   -Dorg.slf4j.simpleLogger.log.net.dreamlu.mica.ai.ppocr=DEBUG  业务包
#   -Dslf4j.simpleLogger.propertiesFile=xxx.properties             切到别的配置
# 可用 LEVEL: trace, debug, info, warn, error

# 输出格式（与原 logback %d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n 风格一致）
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.showSimpleName=false
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.levelInBrackets=true
org.slf4j.simpleLogger.showThreadName=false

# 默认级别
org.slf4j.simpleLogger.defaultLogLevel=info

# 结构化解析（兜底命中通常是 INFO，未命中通常是 WARN）
org.slf4j.simpleLogger.log.net.dreamlu.mica.ai.ppocr.structured=info
# 引擎（设 DEBUG 可看到方向分类结果等）
org.slf4j.simpleLogger.log.net.dreamlu.mica.ai.ppocr.engine=info

# 第三方噪音压到 WARN
org.slf4j.simpleLogger.log.ai.onnxruntime=warn
org.slf4j.simpleLogger.log.org.opencv=warn
org.slf4j.simpleLogger.log.nu.pattern=warn
